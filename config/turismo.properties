# ------------------------------------------------------------
# Configuração da aplicação Gestão de Turismo
# Este ficheiro NÃO deve conter palavras-passe.
# A palavra-passe da BD vem da variável de ambiente TURISMO_DB_PASSWORD
# ou de config/turismo.local.properties (excluído do controlo de versões).
# Qualquer chave pode ser sobreposta com -D<chave>=<valor> na linha de comandos.
# ------------------------------------------------------------

# --- Base de dados Oracle 10g (VM CentOS no UTM) ---
db.host=192.168.64.4
db.port=1521
# Indique db.service (ex.: XE) OU db.sid; o service tem prioridade.
db.service=XE
db.sid=
db.user=yosef
# Tempo máximo (segundos) para abrir a ligação e para cada consulta
db.connectTimeoutSeconds=8
db.queryTimeoutSeconds=30
# Máximo de ligações simultâneas (o Oracle 10g XE tem poucos processos disponíveis)
db.poolSize=4

# --- API REST (backend) ---
api.port=8083

# --- Aplicação desktop (frontend) ---
api.baseUrl=http://localhost:8083/api
api.timeoutSeconds=40
